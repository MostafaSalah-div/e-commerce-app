name: ecommerceapp
description: "A professional Flutter E-Commerce application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  dio: ^5.7.0
  get_it: ^8.0.2
  shared_preferences: ^2.5.1
  go_router: ^14.7.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_spinkit: ^5.2.1
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.3

flutter:
  uses-material-design: true
